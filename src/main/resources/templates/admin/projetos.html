<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerenciar Projetos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b1020; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-slate-100 p-6 relative overflow-hidden">
  <div class="absolute -top-32 -right-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl"></div>

  <div class="relative max-w-4xl mx-auto">
    <header class="mb-8 flex items-center justify-between">
      <h1 class="text-2xl font-bold text-white">Gerenciar Projetos</h1>
      <a href="/configuracoes" class="text-sm text-indigo-300 hover:text-indigo-200">← Configurações</a>
    </header>

    <div th:if="${message}" th:classappend="${messageType != null && messageType == 'error'} ? 'bg-red-500/10 text-red-300 ring-red-500/30' : 'bg-emerald-500/10 text-emerald-300 ring-emerald-500/30'"
         class="p-3 rounded-lg ring-1 mb-6">[[${message}]]</div>

    <section class="bg-white/5 backdrop-blur-md rounded-3xl p-6 ring-1 ring-white/10 mb-8">
      <h2 class="text-lg font-semibold text-white mb-4">Adicionar projeto</h2>
      <form th:action="@{/admin/projetos}" th:object="${projectForm}" method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input name="title" placeholder="Título do projeto" required class="p-3 rounded-lg bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <input name="link" placeholder="Link (opcional)" class="p-3 rounded-lg bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <textarea name="description" placeholder="Descrição" class="sm:col-span-2 p-3 rounded-lg bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <div class="sm:col-span-2">
          <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-semibold rounded-xl hover:from-indigo-400 hover:to-violet-500 transition">Adicionar</button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="text-lg font-semibold text-white mb-4">Projetos cadastrados</h2>
      <div th:if="${#lists.isEmpty(projects)}" class="bg-white/5 rounded-2xl p-6 ring-1 ring-white/10 text-center text-slate-400">
        Nenhum projeto cadastrado ainda.
      </div>

      <div class="space-y-4">
        <div th:each="proj : ${projects}" class="bg-white/5 backdrop-blur-md rounded-2xl p-5 ring-1 ring-white/10">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h3 class="text-lg font-bold text-white" th:text="${proj.title}">Projeto</h3>
              <p class="mt-1 text-slate-300 text-sm" th:text="${proj.description}">Descrição</p>
              <a th:if="${proj.link != null && !#strings.isEmpty(proj.link)}" th:href="${proj.link}" target="_blank" rel="noopener"
                 class="inline-block mt-2 text-indigo-400 text-sm hover:text-indigo-300">Link externo →</a>
            </div>
            <form th:action="@{/admin/projetos/delete}" method="post" class="shrink-0">
              <input type="hidden" name="id" th:value="${proj.id}" />
              <button type="submit" class="px-3 py-1.5 bg-red-500/20 text-red-300 rounded-lg text-sm hover:bg-red-500/30 transition">Excluir</button>
            </form>
          </div>

          <form th:action="@{/admin/projetos/update}" method="post" class="mt-4 pt-4 border-t border-white/10 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input type="hidden" name="id" th:value="${proj.id}" />
            <input name="title" th:value="${proj.title}" class="p-2.5 rounded-lg bg-slate-900/60 border border-white/10 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <input name="link" th:value="${proj.link}" class="p-2.5 rounded-lg bg-slate-900/60 border border-white/10 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <textarea name="description" th:text="${proj.description}" class="sm:col-span-2 p-2.5 rounded-lg bg-slate-900/60 border border-white/10 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <div class="sm:col-span-2">
              <button type="submit" class="px-4 py-2 bg-white/10 text-white rounded-lg text-sm hover:bg-white/20 transition">Salvar edição</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
