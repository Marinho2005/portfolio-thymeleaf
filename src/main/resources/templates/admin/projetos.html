<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerenciar Projetos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0a0a0a; }
  </style>
</head>
<body class="min-h-screen bg-black text-white p-6">
  <div class="max-w-4xl mx-auto">
    <header class="mb-8 flex items-center justify-between">
      <h1 class="text-2xl font-bold text-white">Gerenciar Projetos</h1>
      <a href="/configuracoes" class="text-sm text-red-600 hover:text-red-500 transition">← Configurações</a>
    </header>

    <div th:if="${message}" th:classappend="${messageType != null && messageType == 'error'} ? 'bg-red-900/30 text-red-300 border-red-600' : 'bg-green-900/30 text-green-300 border-green-600'"
         class="p-3 rounded-lg border mb-6">[[${message}]]</div>

    <section class="bg-gray-900 border border-red-700/30 rounded-lg p-6 mb-8">
      <h2 class="text-lg font-semibold text-white mb-4">Adicionar projeto</h2>
      <form th:action="@{/admin/projetos}" th:object="${projectForm}" method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input name="title" placeholder="Título do projeto" required class="p-3 rounded-lg bg-black border border-red-700/30 text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
        <input name="link" placeholder="Link (opcional)" class="p-3 rounded-lg bg-black border border-red-700/30 text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
        <textarea name="description" placeholder="Descrição" class="sm:col-span-2 p-3 rounded-lg bg-black border border-red-700/30 text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition"></textarea>
        <div class="sm:col-span-2">
          <button type="submit" class="px-5 py-2.5 bg-red-600 text-white font-semibold rounded hover:bg-red-700 transition">Adicionar</button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="text-lg font-semibold text-white mb-4">Projetos cadastrados</h2>
      <div th:if="${#lists.isEmpty(projects)}" class="bg-gray-900 border border-red-700/30 rounded-lg p-6 text-center text-gray-400">
        Nenhum projeto cadastrado ainda.
      </div>

      <div class="space-y-4">
        <div th:each="proj : ${projects}" class="bg-gray-900 border border-red-700/30 rounded-lg p-5">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h3 class="text-lg font-bold text-white" th:text="${proj.title}">Projeto</h3>
              <p class="mt-1 text-gray-400 text-sm" th:text="${proj.description}">Descrição</p>
              <a th:if="${proj.link != null && !#strings.isEmpty(proj.link)}" th:href="${proj.link}" target="_blank" rel="noopener"
                 class="inline-block mt-2 text-red-600 text-sm hover:text-red-500 transition">Link externo →</a>
            </div>
            <form th:action="@{/admin/projetos/delete}" method="post" class="shrink-0">
              <input type="hidden" name="id" th:value="${proj.id}" />
              <button type="submit" class="px-3 py-1.5 bg-red-600/20 text-red-400 rounded text-sm hover:bg-red-600/30 transition">Excluir</button>
            </form>
          </div>

          <form th:action="@{/admin/projetos/update}" method="post" class="mt-4 pt-4 border-t border-red-700/30 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input type="hidden" name="id" th:value="${proj.id}" />
            <input name="title" th:value="${proj.title}" class="p-2.5 rounded-lg bg-black border border-red-700/30 text-white text-sm focus:outline-none focus:border-red-600 transition" />
            <input name="link" th:value="${proj.link}" class="p-2.5 rounded-lg bg-black border border-red-700/30 text-white text-sm focus:outline-none focus:border-red-600 transition" />
            <textarea name="description" th:text="${proj.description}" class="sm:col-span-2 p-2.5 rounded-lg bg-black border border-red-700/30 text-white text-sm focus:outline-none focus:border-red-600 transition"></textarea>
            <div class="sm:col-span-2">
              <button type="submit" class="px-4 py-2 bg-gray-700 text-white rounded text-sm hover:bg-gray-600 transition">Salvar edição</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
