<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Configurações</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="max-w-2xl w-full bg-white rounded-2xl shadow p-8">
    <header class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-bold">Configurações</h1>
      <a href="/" class="text-sm text-gray-600 hover:text-gray-900">Voltar</a>
    </header>

    <form th:action="@{/configuracoes}" method="post" class="grid grid-cols-1 gap-4">
      <div th:if="${message}" class="p-3 rounded bg-green-50 text-green-800">[[${message}]]</div>
      <label class="text-sm text-gray-700">Nome de exibição
        <input name="displayName" th:value="${displayName}" class="mt-1 block w-full p-3 border rounded-lg" />
      </label>

      <label class="text-sm text-gray-700">Email
        <input name="email" th:value="${email}" class="mt-1 block w-full p-3 border rounded-lg" />
      </label>

      <label class="text-sm text-gray-700">Tema
        <select name="theme" th:value="${theme}" class="mt-1 block w-full p-3 border rounded-lg">
          <option value="light">Claro</option>
          <option value="dark">Escuro</option>
        </select>
      </label>

      <div class="pt-4 flex justify-end">
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Salvar</button>
      </div>
    </form>

    <footer class="mt-6 text-sm text-gray-500">As configurações aqui são apenas demonstrativas.</footer>
  </div>
</body>
</html>
