<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Configurações</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0a0a0a; }
  </style>
</head>
<body class="min-h-screen bg-black flex items-start justify-center p-6">
  <div class="w-full max-w-2xl bg-gray-900 border border-red-700/30 rounded-lg shadow-2xl p-8 my-10">
    <header class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-bold text-white">Configurações</h1>
      <a href="/portfolio" class="text-sm text-red-600 hover:text-red-500 transition">← Ver portfólio</a>
    </header>

    <div th:if="${message}" th:classappend="${messageType != null && messageType == 'error'} ? 'bg-red-900/30 text-red-300 border-red-600' : 'bg-green-900/30 text-green-300 border-green-600'"
         class="p-3 rounded-lg border mb-4">[[${message}]]</div>

    <form th:action="@{/configuracoes}" method="post" class="grid grid-cols-1 gap-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="text-sm text-gray-300">Nome de exibição
          <input name="displayName" th:value="${displayName}" placeholder="Seu Nome" class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
        </label>
        <label class="text-sm text-gray-300">Email
          <input name="email" th:value="${email}" placeholder="seu@exemplo.com" class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
        </label>
      </div>

      <label class="text-sm text-gray-300">Foto (URL)
        <input name="photoUrl" th:value="${photoUrl}" placeholder="https://.../foto.jpg" class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
      </label>

      <label class="text-sm text-gray-300">Descrição (bio)
        <textarea name="bio" rows="3" placeholder="Desenvolvedor a mais de 30 anos, criando soluções eficazes..." class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition">[[${bio}]]</textarea>
      </label>

      <label class="text-sm text-gray-300">Tema
        <select name="theme" class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white focus:outline-none focus:border-red-600 transition">
          <option value="light" th:selected="${theme == 'light'}">Claro</option>
          <option value="dark" th:selected="${theme == 'dark'}">Escuro</option>
        </select>
      </label>

      <div class="pt-2">
        <h2 class="text-sm font-semibold text-white mb-3">Redes sociais</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="text-sm text-gray-300">GitHub
            <input name="githubUrl" th:value="${githubUrl}" placeholder="https://github.com/usuario" class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
          </label>
          <label class="text-sm text-gray-300">LinkedIn
            <input name="linkedinUrl" th:value="${linkedinUrl}" placeholder="https://linkedin.com/in/usuario" class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
          </label>
          <label class="text-sm text-gray-300">Instagram
            <input name="instagramUrl" th:value="${instagramUrl}" placeholder="https://instagram.com/usuario" class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
          </label>
          <label class="text-sm text-gray-300">X / Twitter
            <input name="twitterUrl" th:value="${twitterUrl}" placeholder="https://x.com/usuario" class="mt-1 block w-full p-3 bg-black border border-red-700/30 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-red-600 transition" />
          </label>
        </div>
      </div>

      <div class="pt-4 flex flex-wrap gap-3">
        <button type="submit" class="px-6 py-2.5 bg-red-600 text-white font-semibold rounded hover:bg-red-700 transition">Salvar</button>
        <a href="/admin/projetos" class="px-6 py-2.5 bg-gray-700 text-white rounded hover:bg-gray-600 transition">Gerenciar projetos</a>
      </div>
    </form>

    <footer class="mt-6 text-sm text-gray-500">Suas configurações são salvas no banco e aplicadas no portfólio.</footer>
  </div>
</body>
</html>
