<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfólio - Início</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .backdrop-blur-md { backdrop-filter: blur(8px); }
    body { background-color: #0b1020; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 flex items-center justify-center p-6 relative overflow-hidden">
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl"></div>

  <div class="relative max-w-xl w-full bg-white/5 backdrop-blur-md rounded-3xl shadow-2xl p-10 ring-1 ring-white/10 text-center">
    <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-violet-600 rounded-2xl flex items-center justify-center text-3xl font-extrabold text-white shadow-lg mb-6">
      V
    </div>
    <h1 class="text-3xl font-extrabold text-white">Bem-vindo, <span th:text="${nome}">Victor</span></h1>
    <p class="mt-3 text-indigo-200/80">Personalize o seu portfólio e mostre seus projetos ao mundo.</p>

    <a href="/configuracoes" class="mt-8 inline-block px-8 py-3 bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-semibold rounded-xl shadow-lg hover:from-indigo-400 hover:to-violet-500 transition">
      Customize seu portfólio
    </a>

    <footer class="mt-10 text-sm text-slate-400">© 2026 - Feito com Java, Spring Boot &amp; Supabase</footer>
  </div>
</body>
</html>
