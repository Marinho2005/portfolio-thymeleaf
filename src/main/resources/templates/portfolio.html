<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio - [[${name}]]</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-blue-50 text-gray-800">
  <div class="max-w-5xl mx-auto p-6">
    <nav class="flex items-center justify-between mb-8">
      <div class="text-xl font-bold">Portfolio</div>
      <div class="space-x-4">
        <a href="/" class="text-sm text-gray-600 hover:text-gray-900">Home</a>
        <a href="#projects" class="text-sm text-gray-600 hover:text-gray-900">Projetos</a>
        <a href="#contact" class="text-sm text-indigo-600 font-medium">Contato</a>
        <a href="/configuracoes" class="text-sm text-gray-600 hover:text-gray-900">Configurações</a>
      </div>
    </nav>

    <header class="bg-white rounded-2xl shadow p-8 mb-8">
      <div class="flex items-center gap-6">
        <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center text-2xl font-bold text-indigo-700">[[${name.substring(0,1)}]]</div>
        <div>
          <h1 class="text-3xl font-extrabold">[[${name}]]</h1>
          <p class="text-indigo-600 mt-1">[[${role}]]</p>
          <p class="mt-3 text-gray-600 max-w-2xl">[[${bio}]]</p>
        </div>
      </div>
    </header>

    <section id="projects" class="mb-8">
      <h2 class="text-2xl font-semibold mb-4">Projetos</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div th:each="proj : ${projects}" class="bg-white p-6 rounded-lg shadow">
          <h3 class="text-lg font-bold text-gray-900" th:text="${proj.title}">Projeto Título</h3>
          <p class="mt-2 text-gray-600" th:text="${proj.description}">Descrição do projeto</p>
          <a th:href="${proj.link}" class="inline-block mt-4 text-indigo-600 hover:underline">Ver mais</a>
        </div>
      </div>
    </section>

    <section id="contact" class="bg-white p-6 rounded-2xl shadow">
      <h2 class="text-2xl font-semibold mb-4">Contato</h2>
      <p class="text-gray-600 mb-4">Interessado em colaborar? Envie uma mensagem.</p>
      <form class="grid grid-cols-1 sm:grid-cols-2 gap-4" th:action="@{/contact}" method="post">
        <input name="name" placeholder="Seu nome" class="p-3 rounded-lg border border-gray-200" />
        <input name="email" placeholder="seu@exemplo.com" class="p-3 rounded-lg border border-gray-200" />
        <textarea name="message" placeholder="Mensagem" class="sm:col-span-2 p-3 rounded-lg border border-gray-200"></textarea>
        <div class="sm:col-span-2 flex justify-end">
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Enviar</button>
        </div>
      </form>
    </section>

    <footer class="mt-8 text-center text-sm text-gray-500">Feito com ❤️ — modelo genérico</footer>
  </div>

  <script src="/static/js/portfolio.js"></script>
</body>
</html>
