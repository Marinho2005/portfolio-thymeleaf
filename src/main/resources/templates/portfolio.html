<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfólio - [[${name}]]</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b1020; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-slate-100 relative overflow-hidden">
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl"></div>

  <div class="relative max-w-5xl mx-auto p-6">
    <nav class="flex items-center justify-between mb-8">
      <div class="text-xl font-bold text-white">Portfólio</div>
      <div class="space-x-4 text-sm">
        <a href="/" class="text-slate-300 hover:text-white">Home</a>
        <a href="#projects" class="text-slate-300 hover:text-white">Projetos</a>
        <a href="#contact" class="text-indigo-400 font-medium hover:text-indigo-300">Contato</a>
        <a href="/configuracoes" class="text-slate-300 hover:text-white">Configurações</a>
      </div>
    </nav>

    <header class="bg-white/5 backdrop-blur-md rounded-3xl shadow-xl p-8 mb-8 ring-1 ring-white/10">
      <div class="flex items-center gap-6">
        <div class="w-24 h-24 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-full flex items-center justify-center text-3xl font-bold text-white shadow-lg">[[${name.substring(0,1)}]]</div>
        <div>
          <h1 class="text-3xl font-extrabold text-white">[[${name}]]</h1>
          <p class="text-indigo-400 mt-1">[[${role}]]</p>
          <p class="mt-3 text-slate-300 max-w-2xl">[[${bio}]]</p>
        </div>
      </div>
    </header>

    <section id="projects" class="mb-8">
      <h2 class="text-2xl font-semibold mb-4 text-white">Projetos</h2>
      <div th:if="${#lists.isEmpty(projects)}" class="bg-white/5 rounded-2xl p-6 ring-1 ring-white/10 text-center text-slate-400">
        Nenhum projeto cadastrado ainda. Adicione em <a href="/admin/projetos" class="text-indigo-400 hover:text-indigo-300">Gerenciar projetos</a>.
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div th:each="proj : ${projects}" class="bg-white/5 backdrop-blur-md p-6 rounded-2xl ring-1 ring-white/10 hover:ring-indigo-500/50 transition">
          <h3 class="text-lg font-bold text-white" th:text="${proj.title}">Projeto</h3>
          <p class="mt-2 text-slate-300" th:text="${proj.description}">Descrição do projeto</p>
          <a th:if="${proj.link != null && !#strings.isEmpty(proj.link)}" th:href="${proj.link}" target="_blank" rel="noopener"
             class="inline-block mt-4 text-indigo-400 hover:text-indigo-300 hover:underline">Ver mais →</a>
        </div>
      </div>
    </section>

    <section id="contact" class="bg-white/5 backdrop-blur-md p-6 rounded-3xl ring-1 ring-white/10">
      <h2 class="text-2xl font-semibold mb-4 text-white">Contato</h2>
      <p class="text-slate-300 mb-4">Interessado em colaborar? Envie uma mensagem.</p>
      <form class="grid grid-cols-1 sm:grid-cols-2 gap-4" th:action="@{/contact}" method="post">
        <input name="name" placeholder="Seu nome" class="p-3 rounded-lg bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <input name="email" placeholder="seu@exemplo.com" class="p-3 rounded-lg bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <textarea name="message" placeholder="Mensagem" class="sm:col-span-2 p-3 rounded-lg bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <div class="sm:col-span-2 flex justify-end">
          <button type="submit" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-lg font-semibold hover:from-indigo-400 hover:to-violet-500 transition">Enviar</button>
        </div>
      </form>
    </section>

    <footer class="mt-8 text-center text-sm text-slate-500">Feito com ❤️</footer>
  </div>

  <script src="/static/js/portfolio.js"></script>
</body>
</html>
